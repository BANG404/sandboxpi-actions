name: Private source CI and CD

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private head or source revision (40 hex characters)
        required: true
        type: string
      action:
        description: Full quality, PR matrix or verified image operation
        required: true
        type: choice
        options: [ci, pr, validate, publish]
        default: ci
      source_branch:
        description: Trusted target branch
        type: choice
        options: [alpha, beta, rc, main]
        default: main
      source_pr:
        description: Same-repository open PR number (required for pr)
        type: string
      run_gates:
        description: Run every substantive matrix gate (always true for pr)
        type: boolean
        default: false
      full_scope:
        description: Force all optional mutation, risk and browser scopes (nightly or explicit full validation)
        type: boolean
        default: true
      request_id:
        description: Optional UUID correlation identifier
        type: string
      watch_check_id:
        description: Optional authenticated discovery check ID
        type: string
      channel:
        description: Container release stage
        type: choice
        options: [alpha, beta, rc, production]
        default: production
      ags_tag:
        description: Optional planned container version
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_BRANCH: ${{ inputs.source_branch }}
  SOURCE_PR: ${{ inputs.source_pr }}
  PUBLIC_ACTION: ${{ inputs.action }}
  RUN_GATES: ${{ inputs.run_gates }}
  FULL_SCOPE: ${{ inputs.full_scope }}
  REQUEST_ID: ${{ inputs.request_id }}
  WATCH_CHECK_ID: ${{ inputs.watch_check_id }}
  AGS_CHANNEL: ${{ inputs.channel }}

jobs:
  prepare:
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      snapshot: ${{ steps.request.outputs.snapshot }}
      run_gates: ${{ steps.request.outputs.run_gates }}
      quality_id: ${{ steps.request.outputs.quality_id }}
      gates_id: ${{ steps.request.outputs.gates_id }}
      image_id: ${{ steps.request.outputs.image_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Validate server-side source and create exact-head checks
        id: request
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: node scripts/status.mjs start
  runner:
    environment: release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Full verification with trusted private output capture
        env:
          PUBLIC_PHASE: quality
          SOURCE_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          GHCR_TOKEN: ${{ github.token }}
        run: node scripts/runtime.mjs
  gate:
    environment: release
    needs: prepare
    if: needs.prepare.outputs.run_gates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        gate: [boundary, coverage, api, integration, security, mutation, risk]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Substantive gate with trusted private output capture
        env:
          PUBLIC_PHASE: gate-${{ matrix.gate }}
          SOURCE_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          GHCR_TOKEN: ${{ github.token }}
        run: node scripts/runtime.mjs
  quality_result:
    environment: release
    if: always() && needs.prepare.outputs.snapshot != ''
    needs: [prepare, runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Revalidate source and report quality immediately
        if: always() && steps.source.outcome == 'success'
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          SOURCE_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          QUALITY_ID: ${{ needs.prepare.outputs.quality_id }}
          JOB_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/status.mjs quality
  gates_result:
    environment: release
    if: always() && needs.prepare.outputs.snapshot != '' && needs.prepare.outputs.run_gates == 'true'
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Revalidate source and report all seven gates immediately
        if: always() && steps.source.outcome == 'success'
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          SOURCE_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          GATES_ID: ${{ needs.prepare.outputs.gates_id }}
          JOB_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/status.mjs gates
  image:
    needs: [prepare, runner, gate, quality_result, gates_result]
    if: >-
      always() && needs.prepare.result == 'success' && needs.runner.result == 'success' &&
      needs.quality_result.result == 'success' &&
      (needs.prepare.outputs.run_gates != 'true' ||
        (needs.gate.result == 'success' && needs.gates_result.result == 'success')) &&
      (inputs.action == 'validate' || inputs.action == 'publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: release
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: release
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: write
      - name: Verify and relay the image through private ACR
        id: image
        env:
          PUBLIC_PHASE: image
          SOURCE_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.release.outputs.token }}
          SKILL_SOURCES_TOKEN: ${{ secrets.SKILL_SOURCES_TOKEN }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          WOODPECKER_TOKEN: ${{ secrets.WOODPECKER_TOKEN }}
          WOODPECKER_REPO_ID: ${{ vars.WOODPECKER_REPO_ID }}
          AGS_TAG: ${{ inputs.ags_tag }}
          TENCENTCLOUD_SECRET_ID: ${{ inputs.action == 'publish' && secrets.TENCENTCLOUD_SECRET_ID || '' }}
          TENCENTCLOUD_SECRET_KEY: ${{ inputs.action == 'publish' && secrets.TENCENTCLOUD_SECRET_KEY || '' }}
          TENCENTCLOUD_SESSION_TOKEN: ${{ inputs.action == 'publish' && secrets.TENCENTCLOUD_SESSION_TOKEN || '' }}
        run: node scripts/runtime.mjs
  finalize:
    environment: release
    if: always() && needs.prepare.outputs.snapshot != ''
    needs: [prepare, runner, gate, quality_result, gates_result, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: BANG404
          repositories: sandboxpi
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Finalize image and discovery receipt without rewriting source checks
        if: always() && steps.source.outcome == 'success'
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          SOURCE_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          QUALITY_ID: ${{ needs.prepare.outputs.quality_id }}
          GATES_ID: ${{ needs.prepare.outputs.gates_id }}
          IMAGE_ID: ${{ needs.prepare.outputs.image_id }}
          JOB_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/status.mjs finish
